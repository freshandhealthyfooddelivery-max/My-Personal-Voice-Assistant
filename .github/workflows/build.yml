name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Logo & Manifest Safely
        run: |
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_nahim_logo.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://android.com" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#040711" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0F172A" android:pathData="M54,10 A44,44 0 1,1 53.9,10 Z"/>
              <path android:fillColor="#38BDF8" android:pathData="M54,22 L62,46 L86,54 L62,62 L54,86 L46,62 L22,54 L46,46 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>
              <application android:allowBackup="true" android:icon="@drawable/ic_nahim_logo" android:label="Nahim AI" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceAssistActivity" android:exported="true" android:showOnLockScreen="true" android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST"/>
                          <action android:name="android.intent.action.VOICE_COMMAND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AssistantTileService" android:exported="true" android:icon="@drawable/ic_nahim_logo" android:label="Nahim AI" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
                  <service android:name=".AppNotificationListener" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <service android:name=".AssistantBackgroundService" android:exported="false"/>
                  <receiver android:name=".SystemEventReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                          <action android:name="android.intent.action.PHONE_STATE"/>
                          <action android:name="android.intent.action.ACTION_POWER_CONNECTED"/>
                          <action android:name="android.intent.action.ACTION_POWER_DISCONNECTED"/>
                          <action android:name="android.net.conn.CONNECTIVITY_CHANGE"/>
                          <action android:name="android.media.RINGER_MODE_CHANGED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          sed -i 's/ android:/ android:/g' app/src/main/AndroidManifest.xml
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"
