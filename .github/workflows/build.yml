name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Complete App on Server
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          w = "andr" + "oid"
          a = w + chr(58)
          lb = chr(91)
          rb = chr(93)

          icon_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns{chr(58)}{w}="http://schemas.{w}.com/apk/res/{w}" {a}width="108dp" {a}height="108dp" {a}viewportWidth="108" {a}viewportHeight="108">
              <path {a}fillColor="#0B0F19" {a}pathData="M0,0h108v108h-108z"/>
              <path {a}fillColor="#1E293B" {a}pathData="M54,14 A40,40 0 1,1 53.9,14 Z"/>
              <path {a}fillColor="#38BDF8" {a}pathData="M50,32h8v44h-8z M36,42h8v24h-8z M64,42h8v24h-8z M22,48h8v12h-8z M78,48h8v12h-8z"/>
          </vector>"""
          open("app/src/main/res/drawable/ic_nahim_logo.xml", "w").write(icon_xml)

          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns{chr(58)}{w}="http://schemas.{w}.com/apk/res/{w}">
              <uses-permission {a}name="{w}.permission.INTERNET" />
              <uses-permission {a}name="{w}.permission.RECORD_AUDIO" />
              <uses-permission {a}name="{w}.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission {a}name="{w}.permission.RECEIVE_SMS" />
              <uses-permission {a}name="{w}.permission.READ_SMS" />
              <uses-permission {a}name="{w}.permission.READ_PHONE_STATE" />
              <uses-permission {a}name="{w}.permission.CALL_PHONE" />
              <uses-permission {a}name="{w}.permission.READ_CONTACTS" />
              <uses-permission {a}name="{w}.permission.POST_NOTIFICATIONS" />
              <uses-permission {a}name="{w}.permission.FOREGROUND_SERVICE" />
              <uses-permission {a}name="{w}.permission.WAKE_LOCK" />
              <uses-permission {a}name="{w}.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission {a}name="{w}.permission.ACCESS_NOTIFICATION_POLICY" />
              <application {a}allowBackup="true" {a}icon="@drawable/ic_nahim_logo" {a}label="AI Voice Pro" {a}supportsRtl="true" {a}theme="@style/Theme.AppCompat.NoActionBar">
                  <activity {a}name=".MainActivity" {a}exported="true">
                      <intent-filter>
                          <action {a}name="{w}.intent.action.MAIN" />
                          <category {a}name="{w}.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service {a}name=".AssistantTileService" {a}exported="true" {a}icon="@drawable/ic_nahim_logo" {a}label="Voice Assistant" {a}permission="{w}.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action {a}name="{w}.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
                  <service {a}name=".AppNotificationListener" {a}exported="true" {a}permission="{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action {a}name="{w}.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <service {a}name=".AssistantBackgroundService" {a}exported="false" />
                  <receiver {a}name=".SystemEventReceiver" {a}exported="true">
                      <intent-filter>
                          <action {a}name="{w}.intent.action.BOOT_COMPLETED" />
                          <action {a}name="{w}.provider.Telephony.SMS_RECEIVED" />
                          <action {a}name="{w}.intent.action.PHONE_STATE" />
                          <action {a}name="{w}.intent.action.ACTION_POWER_CONNECTED" />
                          <action {a}name="{w}.intent.action.ACTION_POWER_DISCONNECTED" />
                          <action {a}name="{w}.net.conn.CONNECTIVITY_CHANGE" />
                          <action {a}name="{w}.media.RINGER_MODE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)

          main_java = f"""package com.personal.voiceassistant;
          import {w}.Manifest;
          import {w}.content.Intent;
          import {w}.content.SharedPreferences;
          import {w}.graphics.Color;
          import {w}.graphics.Typeface;
          import {w}.graphics.drawable.GradientDrawable;
          import {w}.net.Uri;
          import {w}.os.Build;
          import {w}.os.Bundle;
          import {w}.os.Handler;
          import {w}.os.Looper;
          import {w}.provider.Settings;
          import {w}.speech.RecognizerIntent;
          import {w}.view.Gravity;
          import {w}.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import java.io.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {{
              private SharedPreferences prefs;
              private LinearLayout contentArea;
              private boolean isEn = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  if (getSupportActionBar() != null) getSupportActionBar().hide();
                  getWindow().setStatusBarColor(Color.parseColor("#070B14"));
                  prefs = getSharedPreferences("AssistantPrefs", MODE_PRIVATE);
                  isEn = prefs.getBoolean("ui_english", false);

                  LinearLayout mainRoot = new LinearLayout(this);
                  mainRoot.setOrientation(LinearLayout.VERTICAL);
                  mainRoot.setBackgroundColor(Color.parseColor("#070B14"));

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setPadding(40, 45, 40, 25);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  titleBox.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));

                  TextView appTitle = new TextView(this);
                  appTitle.setText("AI Voice Pro");
                  appTitle.setTextColor(Color.WHITE);
                  appTitle.setTextSize(23);
                  appTitle.setTypeface(null, Typeface.BOLD);
                  titleBox.addView(appTitle);

                  TextView devTag = new TextView(this);
                  devTag.setText("✦ Crafted by NAHIM");
                  devTag.setTextColor(Color.parseColor("#FBBF24"));
                  devTag.setTextSize(11);
                  devTag.setTypeface(null, Typeface.BOLD);
                  titleBox.addView(devTag);
                  topBar.addView(titleBox);

                  Button langToggle = new Button(this);
                  langToggle.setText(isEn ? "বাংলা" : "English");
                  langToggle.setTextColor(Color.WHITE);
                  langToggle.setTextSize(12);
                  langToggle.setAllCaps(false);
                  GradientDrawable lg = new GradientDrawable();
                  lg.setColor(Color.parseColor("#1E293B"));
                  lg.setCornerRadius(30f);
                  lg.setStroke(2, Color.parseColor("#38BDF8"));
                  langToggle.setBackground(lg);
                  langToggle.setOnClickListener(v -> {{
                      isEn = !isEn;
                      prefs.edit().putBoolean("ui_english", isEn).apply();
                      recreate();
                  }});
                  topBar.addView(langToggle);
                  mainRoot.addView(topBar);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));
                  contentArea = new LinearLayout(this);
                  contentArea.setOrientation(LinearLayout.VERTICAL);
                  contentArea.setPadding(36, 10, 36, 30);
                  scroll.addView(contentArea);
                  mainRoot.addView(scroll);

                  LinearLayout navBar = new LinearLayout(this);
                  navBar.setOrientation(LinearLayout.HORIZONTAL);
                  navBar.setBackgroundColor(Color.parseColor("#0F172A"));
                  navBar.setPadding(12, 16, 12, 20);
                  addNavTab(navBar, isEn ? "Home" : "হোম", 0);
                  addNavTab(navBar, isEn ? "Call/Msg" : "কল/মেসেজ", 1);
                  addNavTab(navBar, isEn ? "Power/Sec" : "নিরাপত্তা", 2);
                  addNavTab(navBar, isEn ? "Calendar" : "ক্যালেন্ডার", 3);
                  addNavTab(navBar, isEn ? "Settings" : "সেটিংস", 4);
                  mainRoot.addView(navBar);

                  setContentView(mainRoot);
                  renderTab(0);
                  if (prefs.getBoolean("master_switch", false)) startService(new Intent(this, AssistantBackgroundService.class));
              }}

              private void addNavTab(LinearLayout bar, String label, int idx) {{
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(11);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
