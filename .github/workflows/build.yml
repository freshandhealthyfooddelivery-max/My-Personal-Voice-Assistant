name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Glass OS APK
        run: |
          python3 -c 'import os; os.makedirs("app/src/main/res/drawable", exist_ok=True); w="andr"+"oid"; a=w+chr(58); lb=chr(91); rb=chr(93); open("app/src/main/res/drawable/ic_nahim_logo.xml","w").write(f"<vector xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\" {a}width=\"108dp\" {a}height=\"108dp\" {a}viewportWidth=\"108\" {a}viewportHeight=\"108\"><path {a}fillColor=\"#040711\" {a}pathData=\"M0,0h108v108h-108z\"/><path {a}fillColor=\"#0F172A\" {a}pathData=\"M54,10 A44,44 0 1,1 53.9,10 Z\"/><path {a}fillColor=\"#38BDF8\" {a}pathData=\"M54,22 L62,46 L86,54 L62,62 L54,86 L46,62 L22,54 L46,46 Z\"/></vector>"); open("app/src/main/AndroidManifest.xml","w").write(f"<manifest xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\"><uses-permission {a}name=\"{w}.permission.INTERNET\"/><uses-permission {a}name=\"{w}.permission.ACCESS_COARSE_LOCATION\"/><uses-permission {a}name=\"{w}.permission.RECORD_AUDIO\"/><uses-permission {a}name=\"{w}.permission.CAMERA\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_BOOT_COMPLETED\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_PHONE_STATE\"/><uses-permission {a}name=\"{w}.permission.CALL_PHONE\"/><uses-permission {a}name=\"{w}.permission.ANSWER_PHONE_CALLS\"/><uses-permission {a}name=\"{w}.permission.READ_CONTACTS\"/><uses-permission {a}name=\"{w}.permission.POST_NOTIFICATIONS\"/><uses-permission {a}name=\"{w}.permission.FOREGROUND_SERVICE\"/><uses-permission {a}name=\"{w}.permission.WAKE_LOCK\"/><uses-permission {a}name=\"{w}.permission.MODIFY_AUDIO_SETTINGS\"/><uses-permission {a}name=\"{w}.permission.ACCESS_NOTIFICATION_POLICY\"/><application {a}allowBackup=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}supportsRtl=\"true\" {a}theme=\"@style/Theme.AppCompat.NoActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.MAIN\"/><category {a}name=\"{w}.intent.category.LAUNCHER\"/></intent-filter></activity><activity {a}name=\".VoiceAssistActivity\" {a}exported=\"true\" {a}showOnLockScreen=\"true\" {a}turnScreenOn=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.ASSIST\"/><action {a}name=\"{w}.intent.action.VOICE_COMMAND\"/><category {a}name=\"{w}.intent.category.DEFAULT\"/></intent-filter></activity><service {a}name=\".AssistantTileService\" {a}exported=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}permission=\"{w}.permission.BIND_QUICK_SETTINGS_TILE\"><intent-filter><action {a}name=\"{w}.service.quicksettings.action.QS_TILE\"/></intent-filter></service><service {a}name=\".AppNotificationListener\" {a}exported=\"true\" {a}permission=\"{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action {a}name=\"{w}.service.notification.NotificationListenerService\"/></intent-filter></service><service {a}name=\".AssistantBackgroundService\" {a}exported=\"false\"/><receiver {a}name=\".SystemEventReceiver\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.BOOT_COMPLETED\"/><action {a}name=\"{w}.provider.Telephony.SMS_RECEIVED\"/><action {a}name=\"{w}.intent.action.PHONE_STATE\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_CONNECTED\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_DISCONNECTED\"/><action {a}name=\"{w}.net.conn.CONNECTIVITY_CHANGE\"/><action {a}name=\"{w}.media.RINGER_MODE_CHANGED\"/></intent-filter></receiver></application></manifest>"); p="app/src/main/java/com/personal/voiceassistant/"; open(p+"VoiceAssistActivity.java","w").write(f"package com.personal.voiceassistant; import {w}.app.Activity; import {w}.content.*; import {w}.hardware.camera2.CameraManager; import {w}.os.*; import {w}.speech.RecognizerIntent; import {w}.view.WindowManager; import java.text.SimpleDateFormat; import java.util.*; public class VoiceAssistActivity extends Activity {{ private static boolean torchOn = false; @Override protected void onCreate(Bundle b) {{ super.onCreate(b); getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON); Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, \"bn-BD\"); try {{ startActivityForResult(i, 505); }} catch (Exception e) {{ finish(); }} }} @Override protected void onActivityResult(int req, int res, Intent data) {{ super.onActivityResult(req, res, data); if (req == 505 && res == RESULT_OK && data != null) {{ ArrayList<String> l = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS); if (l != null && !l.isEmpty()) {{ String q = l.get(0).toLowerCase(); if (q.contains(\"আরবি\") || q.contains(\"হিজরি\")) SystemEventReceiver.speak(this, SmartCalendarWeather.getHijriDateInfo(this)); else if (q.contains(\"বাংলা\") || q.contains(\"তারিখ\")) SystemEventReceiver.speak(this, SmartCalendarWeather.getBanglaDateInfo(this)); else if (q.contains(\"আবহাওয়া\") || q.contains(\"weather\")) SmartCalendarWeather.fetchAndSpeakWeather(this); else if (q.contains(\"সময়\") || q.contains(\"time\")) SystemEventReceiver.speak(this, \"এখন সময় \" + new SimpleDateFormat(\"hh:mm a\", Locale.US).format(new Date())); else if (q.contains(\"ব্যাটারি\")) {{ Intent bi = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED)); SystemEventReceiver.speak(this, \"চার্জ \" + (bi != null ? bi.getIntExtra(BatteryManager.EXTRA_LEVEL, 100) : 100) + \" পার্সেন্ট\"); }} else if (q.contains(\"টর্চ\")) {{ try {{ CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE); torchOn = !torchOn; cm.setTorchMode(cm.getCameraIdList(){lb}0{rb}, torchOn); }} catch (Exception ignored) {{}} }} else SystemEventReceiver.speak(this, SmartCalendarWeather.getEnglishAndDayInfo()); }} }} finish(); }} }}"); m=open(p+"MainActivity.java").read().replace("String a = new String;",f"String{lb}{rb} a = new String{lb}p.size(){rb};").replace("String[] a = new String;",f"String{lb}{rb} a = new String{lb}p.size(){rb};"); open(p+"MainActivity.java","w").write(m); sr=open(p+"SystemEventReceiver.java").read().replace("SmsMessage msgs = Telephony",f"SmsMessage{lb}{rb} msgs = Telephony").replace("new String{ContactsContract",f"new String{lb}{rb}{{ContactsContract").replace("new String[]{ContactsContract",f"new String{lb}{rb}{{ContactsContract"); open(p+"SystemEventReceiver.java","w").write(sr); ab=open(p+"AssistantBackgroundService.java").read().replace("e.values*e.values + e.values*e.values + e.values*e.values",f"e.values{lb}0{rb}*e.values{lb}0{rb} + e.values{lb}1{rb}*e.values{lb}1{rb} + e.values{lb}2{rb}*e.values{lb}2{rb}").replace("cm.getCameraIdList(), torch",f"cm.getCameraIdList(){lb}0{rb}, torch"); open(p+"AssistantBackgroundService.java","w").write(ab)'
                - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"

