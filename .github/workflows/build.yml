name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix UI & Build APK
        run: |
          python3 -c 'import os; w="andr"+"oid"; a=w+chr(58); lb=chr(91); rb=chr(93); open("app/src/main/AndroidManifest.xml","w").write(f"<manifest xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\"><uses-permission {a}name=\"{w}.permission.INTERNET\"/><uses-permission {a}name=\"{w}.permission.RECORD_AUDIO\"/><uses-permission {a}name=\"{w}.permission.CAMERA\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_BOOT_COMPLETED\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_PHONE_STATE\"/><uses-permission {a}name=\"{w}.permission.CALL_PHONE\"/><uses-permission {a}name=\"{w}.permission.ANSWER_PHONE_CALLS\"/><uses-permission {a}name=\"{w}.permission.READ_CONTACTS\"/><uses-permission {a}name=\"{w}.permission.POST_NOTIFICATIONS\"/><uses-permission {a}name=\"{w}.permission.FOREGROUND_SERVICE\"/><uses-permission {a}name=\"{w}.permission.WAKE_LOCK\"/><uses-permission {a}name=\"{w}.permission.MODIFY_AUDIO_SETTINGS\"/><uses-permission {a}name=\"{w}.permission.ACCESS_NOTIFICATION_POLICY\"/><application {a}allowBackup=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}supportsRtl=\"true\" {a}theme=\"@style/Theme.AppCompat.NoActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.MAIN\"/><category {a}name=\"{w}.intent.category.LAUNCHER\"/></intent-filter></activity><activity {a}name=\".VoiceAssistActivity\" {a}exported=\"true\" {a}showOnLockScreen=\"true\" {a}turnScreenOn=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.ASSIST\"/><action {a}name=\"{w}.intent.action.VOICE_COMMAND\"/><category {a}name=\"{w}.intent.category.DEFAULT\"/></intent-filter></activity><service {a}name=\".AssistantTileService\" {a}exported=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}permission=\"{w}.permission.BIND_QUICK_SETTINGS_TILE\"><intent-filter><action {a}name=\"{w}.service.quicksettings.action.QS_TILE\"/></intent-filter></service><service {a}name=\".AppNotificationListener\" {a}exported=\"true\" {a}permission=\"{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action {a}name=\"{w}.service.notification.NotificationListenerService\"/></intent-filter></service><service {a}name=\".AssistantBackgroundService\" {a}exported=\"false\"/><receiver {a}name=\".SystemEventReceiver\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.BOOT_COMPLETED\"/><action {a}name=\"{w}.provider.Telephony.SMS_RECEIVED\"/><action {a}name=\"{w}.intent.action.PHONE_STATE\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_CONNECTED\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_DISCONNECTED\"/><action {a}name=\"{w}.net.conn.CONNECTIVITY_CHANGE\"/><action {a}name=\"{w}.media.RINGER_MODE_CHANGED\"/></intent-filter></receiver></application></manifest>"); hp="app/src/main/assets/ui.html"; top=open(hp).read().split("<div id=\"p_cal\"").split("<script>"); sq=chr(39); btm=f"<div id=\"p_cal\" class=\"page\"><div class=\"back\" onclick=\"openP({sq}home{sq})\">← Back</div><div class=\"glass\"><div class=\"row\"><div class=\"lbl\">৫ ওয়াক্ত নামাজের অ্যালার্ম</div><label class=\"sw\"><input type=\"checkbox\" id=\"namaz_alarm\" onchange=\"saveB(this)\"><span class=\"sl\"></span></label></div><div class=\"row\"><div class=\"lbl\">প্রতি শুক্রবার সকাল ৮টা বার্তা</div><label class=\"sw\"><input type=\"checkbox\" id=\"friday_alert\" onchange=\"saveB(this)\"><span class=\"sl\"></span></label></div><button class=\"btn\" onclick=\"NahimCore.action({sq}pick_ramadan{sq})\">📂 Upload Ramadan (.txt)</button><button class=\"btn\" onclick=\"NahimCore.action({sq}pick_bangla{sq})\">📂 Upload Bangla Cal (.txt)</button><button class=\"btn\" onclick=\"NahimCore.action({sq}pick_arabic{sq})\">📂 Upload Arabic Cal (.txt)</button></div></div><div id=\"p_sys\" class=\"page\"><div class=\"back\" onclick=\"openP({sq}home{sq})\">← Back</div><div class=\"glass\"><div class=\"row\"><div class=\"lbl\">রাতের স্লিপ মোড (১২টা-৫টা)</div><label class=\"sw\"><input type=\"checkbox\" id=\"sleep_mode\" onchange=\"saveB(this)\"><span class=\"sl\"></span></label></div><div class=\"row\"><div class=\"lbl\">সকাল ৭টা গুড মর্নিং ব্রিফিং</div><label class=\"sw\"><input type=\"checkbox\" id=\"morning_brief\" onchange=\"saveB(this)\"><span class=\"sl\"></span></label></div><div class=\"chips\"><div class=\"chip\" onclick=\"NahimCore.setInt({sq}clock_interval{sq},15)\">15m</div><div class=\"chip\" onclick=\"NahimCore.setInt({sq}clock_interval{sq},30)\">30m</div><div class=\"chip\" onclick=\"NahimCore.setInt({sq}clock_interval{sq},60)\">1h</div><div class=\"chip\" onclick=\"NahimCore.setInt({sq}clock_interval{sq},0)\">Off</div></div><div class=\"chips\"><div class=\"chip\" onclick=\"setV({sq}bn{sq})\">বাংলা</div><div class=\"chip\" onclick=\"setV({sq}en_uk{sq})\">UK</div><div class=\"chip\" onclick=\"setV({sq}hi{sq})\">हिन्दी</div><div class=\"chip\" onclick=\"setV({sq}ar{sq})\">العربية</div></div><div class=\"chips\"><div class=\"chip\" onclick=\"setG(false)\">👩 Female</div><div class=\"chip\" onclick=\"setG(true)\">👨 Male</div></div><button class=\"btn\" style=\"background:#f59e0b\" onclick=\"NahimCore.action({sq}perm_sys{sq})\">1. Grant Permissions</button><button class=\"btn\" style=\"background:#ec4899\" onclick=\"NahimCore.action({sq}perm_notif{sq})\">2. Notification Access</button></div></div><script>var en=false;var keys={lb}\"master_switch\",\"call_switch\",\"riding_mode\",\"auto_unsilent\",\"sms_switch\",\"sms_full_read\",\"app_notif_switch\",\"headphone_privacy\",\"battery_switch\",\"full_charge_alarm\",\"theft_alarm\",\"shake_torch\",\"network_alert\",\"namaz_alarm\",\"friday_alert\",\"sleep_mode\",\"morning_brief\"{rb};window.onload=function(){{try{{for(var i=0;i<keys.length;i++){{var e=document.getElementById(keys{lb}i{rb});if(e)e.checked=NahimCore.getBool(keys{lb}i{rb});}}document.getElementById(\"batTxt\").innerText=\"⚡ Live Battery: \"+NahimCore.getBattery()+\"%\";}}catch(err){{}}}};function saveB(el){{try{{NahimCore.setBool(el.id,el.checked);}}catch(e){{}}}}function openP(id){{var ps=document.querySelectorAll(\".page\");for(var i=0;i<ps.length;i++)ps{lb}i{rb}.classList.remove(\"active\");document.getElementById(id).classList.add(\"active\");window.scrollTo(0,0);}}function toggleLang(){{en=!en;document.getElementById(\"lBtn\").innerText=en?\"বাংলা\":\"English\";var bs=document.querySelectorAll(\"{lb}data-bn{rb}\");for(var i=0;i<bs.length;i++)bs{lb}i{rb}.innerText=en?bs{lb}i{rb}.getAttribute(\"data-en\"):bs{lb}i{rb}.getAttribute(\"data-bn\");}}function setV(l){{try{{NahimCore.setStr(\"voice_lang\",l);NahimCore.action(\"test_voice\");}}catch(e){{}}}}function setG(m){{try{{NahimCore.setBool(\"voice_male\",m);NahimCore.action(\"test_voice\");}}catch(e){{}}}}function runCall(){{var n=document.getElementById(\"cNum\").value,s=parseInt(document.getElementById(\"cSec\").value);if(n&&s)NahimCore.startAutoCall(n,s);}}</script></body></html>"; open(hp,"w").write(top+btm)'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"
