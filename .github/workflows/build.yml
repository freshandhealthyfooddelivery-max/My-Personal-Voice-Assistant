name: Build Galaxy Ultra AI Assistant

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate One UI 7 Ultra Architecture
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          w = "andr" + "oid"
          a = w + chr(58)

          logo = f"<vector xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\" {a}width=\"108dp\" {a}height=\"108dp\" {a}viewportWidth=\"108\" {a}viewportHeight=\"108\"><path {a}fillColor=\"#000000\" {a}pathData=\"M0,0h108v108h-108z\"/><path {a}fillColor=\"#1C1C1E\" {a}pathData=\"M54,10 A44,44 0 1,1 53.9,10 Z\"/><path {a}fillColor=\"#3E91FF\" {a}pathData=\"M54,24 L61,47 L84,54 L61,61 L54,84 L47,61 L24,54 L47,47 Z\"/></vector>"
          open("app/src/main/res/drawable/ic_nahim_logo.xml", "w").write(logo)

          manifest = f"<manifest xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\"><uses-permission {a}name=\"{w}.permission.INTERNET\"/><uses-permission {a}name=\"{w}.permission.RECORD_AUDIO\"/><uses-permission {a}name=\"{w}.permission.CAMERA\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_BOOT_COMPLETED\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_PHONE_STATE\"/><uses-permission {a}name=\"{w}.permission.CALL_PHONE\"/><uses-permission {a}name=\"{w}.permission.ANSWER_PHONE_CALLS\"/><uses-permission {a}name=\"{w}.permission.READ_CONTACTS\"/><uses-permission {a}name=\"{w}.permission.POST_NOTIFICATIONS\"/><uses-permission {a}name=\"{w}.permission.FOREGROUND_SERVICE\"/><uses-permission {a}name=\"{w}.permission.WAKE_LOCK\"/><uses-permission {a}name=\"{w}.permission.MODIFY_AUDIO_SETTINGS\"/><uses-permission {a}name=\"{w}.permission.ACCESS_NOTIFICATION_POLICY\"/><application {a}allowBackup=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Galaxy AI Pro\" {a}supportsRtl=\"true\" {a}theme=\"@style/Theme.Material3.Dark.NoActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.MAIN\"/><category {a}name=\"{w}.intent.category.LAUNCHER\"/></intent-filter></activity><activity {a}name=\".VoiceAssistActivity\" {a}exported=\"true\" {a}showOnLockScreen=\"true\" {a}turnScreenOn=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.ASSIST\"/><action {a}name=\"{w}.intent.action.VOICE_COMMAND\"/><category {a}name=\"{w}.intent.category.DEFAULT\"/></intent-filter></activity><service {a}name=\".AssistantTileService\" {a}exported=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Galaxy AI\" {a}permission=\"{w}.permission.BIND_QUICK_SETTINGS_TILE\"><intent-filter><action {a}name=\"{w}.service.quicksettings.action.QS_TILE\"/></intent-filter></service><service {a}name=\".AppNotificationListener\" {a}exported=\"true\" {a}permission=\"{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action {a}name=\"{w}.service.notification.NotificationListenerService\"/></intent-filter></service><service {a}name=\".AssistantBackgroundService\" {a}exported=\"false\"/><receiver {a}name=\".SystemEventReceiver\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.BOOT_COMPLETED\"/><action {a}name=\"{w}.provider.Telephony.SMS_RECEIVED\"/><action {a}name=\"{w}.intent.action.PHONE_STATE\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_CONNECTED\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_DISCONNECTED\"/><action {a}name=\"{w}.net.conn.CONNECTIVITY_CHANGE\"/><action {a}name=\"{w}.media.RINGER_MODE_CHANGED\"/></intent-filter></receiver></application></manifest>"
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          srv = f"""package com.personal.voiceassistant;
          import {w}.app.*;
          import {w}.content.*;
          import {w}.hardware.*;
          import {w}.hardware.camera2.CameraManager;
          import {w}.media.*;
          import {w}.net.Uri;
          import {w}.os.*;
          import {w}.telecom.TelecomManager;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class AssistantBackgroundService extends Service implements SensorEventListener {{
              private Handler handler;
              private int lastBat = -1;
              private SensorManager sm;
              private long lastShake = 0;
              private boolean torch = false;

              private final BroadcastReceiver batRec = new BroadcastReceiver() {{
                  @Override
                  public void onReceive(Context ctx, Intent i) {{
                      SharedPreferences p = getSharedPreferences("AssistantPrefs", MODE_PRIVATE);
                      if (!p.getBoolean("master_switch", false)) return;
                      int lvl = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                      boolean chg = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL;
                      if (lvl != lastBat && p.getBoolean("battery_switch", false)) {{
                          if (chg && (lvl == 20 || lvl == 50 || lvl == 80 || lvl == 100)) {{
                              lastBat = lvl; SystemEventReceiver.speak(ctx, "ব্যাটারি " + lvl + " পার্সেন্ট চার্জ হয়েছে");
                              if (lvl == 100 && p.getBoolean("full_charge_alarm", false)) new ToneGenerator(AudioManager.STREAM_ALARM, 100).startTone(ToneGenerator.TONE_PROP_BEEP2, 3000);
                          }} else if (!chg && (lvl == 80 || lvl == 60 || lvl == 40 || lvl == 20 || lvl == 10)) {{
                              lastBat = lvl; SystemEventReceiver.speak(ctx, "ব্যাটারি চার্জ " + lvl + " পার্সেন্ট");
                          }}
                      }}
                  }}
              }};

              @Override
              public void onCreate() {{
                  super.onCreate();
                  try {{
                      NotificationChannel ch = new NotificationChannel("galaxy_ai_core", "Galaxy AI Core", NotificationManager.IMPORTANCE_MIN);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, "galaxy_ai_core").setContentTitle("Galaxy AI Pro").setContentText("Crafted by NAHIM").setSmallIcon({w}.R.drawable.ic_btn_speak_now).build();
                      startForeground(1001, n);
                  }} catch (Exception ignored) {{}}
                  try {{ registerReceiver(batRec, new IntentFilter(Intent.ACTION_BATTERY_CHANGED)); }} catch (Exception ignored) {{}}
                  try {{
                      sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                      if (sm != null) sm.registerListener(this, sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER), SensorManager.SENSOR_DELAY_NORMAL);
                  }} catch (Exception ignored) {{}}
                  handler = new Handler(Looper.getMainLooper());
                  handler.postDelayed(new Runnable() {{
                      @Override public void run() {{ tick(); handler.postDelayed(this, 60000); }}
                  }}, 10000);
              }}

              private void tick() {{
                  SharedPreferences p = getSharedPreferences("AssistantPrefs", MODE_PRIVATE);
                  if (!p.getBoolean("master_switch", false)) return;
                  Calendar c = Calendar.getInstance();
                  int m = c.get(Calendar.MINUTE), h = c.get(Calendar.HOUR_OF_DAY);
                  if (p.getBoolean("sleep_mode", false) && h >= 0 && h < 5) return;
                  int iv = p.getInt("clock_interval", 0);
                  if (iv > 0 && m % iv == 0) SystemEventReceiver.speak(this, "এখন সময় " + new SimpleDateFormat("hh:mm a", Locale.US).format(new Date()));
                  if (p.getBoolean("friday_alert", false) && c.get(Calendar.DAY_OF_WEEK) == Calendar.FRIDAY && h == 8 && m == 0) SystemEventReceiver.speak(this, "আজ পবিত্র শুক্রবার");
                  if (p.getBoolean("morning_brief", false) && h == 7 && m == 0) SystemEventReceiver.speak(this, "শুভ সকাল। " + SmartCalendarWeather.getBanglaDateInfo(this));
                  if (p.getBoolean("namaz_alarm", false)) {{
                      String hhmm = String.format(Locale.US, "%02d:%02d", h, m);
                      if (hhmm.equals("05:00")) SystemEventReceiver.speak(this, "ফজরের নামাজের সময় হয়েছে");
                      if (hhmm.equals("13:00")) SystemEventReceiver.speak(this, "জোহরের নামাজের সময় হয়েছে");
                      if (hhmm.equals("16:15")) SystemEventReceiver.speak(this, "আসরের নামাজের সময় হয়েছে");
                      if (hhmm.equals("18:05")) SystemEventReceiver.speak(this, "মাগরিবের নামাজের সময় হয়েছে");
                      if (hhmm.equals("19:30")) SystemEventReceiver.speak(this, "এশার নামাজের সময় হয়েছে");
                  }}
              }}

              @Override
              public void onSensorChanged(SensorEvent e) {{
                  SharedPreferences p = getSharedPreferences("AssistantPrefs", MODE_PRIVATE);
                  if (!p.getBoolean("master_switch", false) || !p.getBoolean("shake_torch", false)) return;
                  double a = Math.sqrt(e.values[0]*e.values[0] + e.values[1]*e.values[1] + e.values[2]*e.values[2]) - SensorManager.GRAVITY_EARTH;
                  if (a > 14 && System.currentTimeMillis() - lastShake > 1500) {{
                      lastShake = System.currentTimeMillis();
