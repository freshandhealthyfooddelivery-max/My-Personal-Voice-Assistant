name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Premium Icon & Manifest
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          w = "andr" + "oid"
          a = w + chr(58)
          lb = chr(91)
          rb = chr(93)

          icon_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns{chr(58)}{w}="http://schemas.{w}.com/apk/res/{w}" {a}width="108dp" {a}height="108dp" {a}viewportWidth="108" {a}viewportHeight="108">
              <path {a}fillColor="#0B0F19" {a}pathData="M0,0h108v108h-108z"/>
              <path {a}fillColor="#1E293B" {a}pathData="M54,14 A40,40 0 1,1 53.9,14 Z"/>
              <path {a}fillColor="#38BDF8" {a}pathData="M50,32h8v44h-8z M36,42h8v24h-8z M64,42h8v24h-8z M22,48h8v12h-8z M78,48h8v12h-8z"/>
          </vector>"""
          open("app/src/main/res/drawable/ic_nahim_logo.xml", "w").write(icon_xml)

          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns{chr(58)}{w}="http://schemas.{w}.com/apk/res/{w}">
              <uses-permission {a}name="{w}.permission.INTERNET" />
              <uses-permission {a}name="{w}.permission.RECORD_AUDIO" />
              <uses-permission {a}name="{w}.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission {a}name="{w}.permission.RECEIVE_SMS" />
              <uses-permission {a}name="{w}.permission.READ_SMS" />
              <uses-permission {a}name="{w}.permission.READ_PHONE_STATE" />
              <uses-permission {a}name="{w}.permission.CALL_PHONE" />
              <uses-permission {a}name="{w}.permission.READ_CONTACTS" />
              <uses-permission {a}name="{w}.permission.POST_NOTIFICATIONS" />
              <uses-permission {a}name="{w}.permission.FOREGROUND_SERVICE" />
              <uses-permission {a}name="{w}.permission.WAKE_LOCK" />
              <uses-permission {a}name="{w}.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission {a}name="{w}.permission.ACCESS_NOTIFICATION_POLICY" />
              <application {a}allowBackup="true" {a}icon="@drawable/ic_nahim_logo" {a}label="AI Voice Pro" {a}supportsRtl="true" {a}theme="@style/Theme.AppCompat.NoActionBar">
                  <activity {a}name=".MainActivity" {a}exported="true">
                      <intent-filter>
                          <action {a}name="{w}.intent.action.MAIN" />
                          <category {a}name="{w}.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service {a}name=".AssistantTileService" {a}exported="true" {a}icon="@drawable/ic_nahim_logo" {a}label="Voice Assistant" {a}permission="{w}.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action {a}name="{w}.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
                  <service {a}name=".AppNotificationListener" {a}exported="true" {a}permission="{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action {a}name="{w}.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <service {a}name=".AssistantBackgroundService" {a}exported="false" />
                  <receiver {a}name=".SystemEventReceiver" {a}exported="true">
                      <intent-filter>
                          <action {a}name="{w}.intent.action.BOOT_COMPLETED" />
                          <action {a}name="{w}.provider.Telephony.SMS_RECEIVED" />
                          <action {a}name="{w}.intent.action.PHONE_STATE" />
                          <action {a}name="{w}.intent.action.ACTION_POWER_CONNECTED" />
                          <action {a}name="{w}.intent.action.ACTION_POWER_DISCONNECTED" />
                          <action {a}name="{w}.net.conn.CONNECTIVITY_CHANGE" />
                          <action {a}name="{w}.media.RINGER_MODE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoiceAssistant-APK
          path: "**/app-debug.apk"
