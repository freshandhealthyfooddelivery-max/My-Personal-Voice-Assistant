name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Auto-Fix All Java Brackets & Manifest
        run: |
          python3 -c '
          import os, re
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          w = "andr" + "oid"
          a = w + chr(58)
          lb = chr(91)
          rb = chr(93)
          open("app/src/main/res/drawable/ic_nahim_logo.xml","w").write(f"<vector xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\" {a}width=\"108dp\" {a}height=\"108dp\" {a}viewportWidth=\"108\" {a}viewportHeight=\"108\"><path {a}fillColor=\"#040711\" {a}pathData=\"M0,0h108v108h-108z\"/><path {a}fillColor=\"#0F172A\" {a}pathData=\"M54,10 A44,44 0 1,1 53.9,10 Z\"/><path {a}fillColor=\"#38BDF8\" {a}pathData=\"M54,22 L62,46 L86,54 L62,62 L54,86 L46,62 L22,54 L46,46 Z\"/></vector>")
          open("app/src/main/AndroidManifest.xml","w").write(f"<manifest xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\"><uses-permission {a}name=\"{w}.permission.INTERNET\"/><uses-permission {a}name=\"{w}.permission.ACCESS_COARSE_LOCATION\"/><uses-permission {a}name=\"{w}.permission.RECORD_AUDIO\"/><uses-permission {a}name=\"{w}.permission.CAMERA\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_BOOT_COMPLETED\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_PHONE_STATE\"/><uses-permission {a}name=\"{w}.permission.CALL_PHONE\"/><uses-permission {a}name=\"{w}.permission.ANSWER_PHONE_CALLS\"/><uses-permission {a}name=\"{w}.permission.READ_CONTACTS\"/><uses-permission {a}name=\"{w}.permission.POST_NOTIFICATIONS\"/><uses-permission {a}name=\"{w}.permission.FOREGROUND_SERVICE\"/><uses-permission {a}name=\"{w}.permission.WAKE_LOCK\"/><uses-permission {a}name=\"{w}.permission.MODIFY_AUDIO_SETTINGS\"/><uses-permission {a}name=\"{w}.permission.ACCESS_NOTIFICATION_POLICY\"/><application {a}allowBackup=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}supportsRtl=\"true\" {a}theme=\"@style/Theme.AppCompat.NoActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.MAIN\"/><category {a}name=\"{w}.intent.category.LAUNCHER\"/></intent-filter></activity><activity {a}name=\".VoiceAssistActivity\" {a}exported=\"true\" {a}showOnLockScreen=\"true\" {a}turnScreenOn=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.ASSIST\"/><action {a}name=\"{w}.intent.action.VOICE_COMMAND\"/><category {a}name=\"{w}.intent.category.DEFAULT\"/></intent-filter></activity><service {a}name=\".AssistantTileService\" {a}exported=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}permission=\"{w}.permission.BIND_QUICK_SETTINGS_TILE\"><intent-filter><action {a}name=\"{w}.service.quicksettings.action.QS_TILE\"/></intent-filter></service><service {a}name=\".AppNotificationListener\" {a}exported=\"true\" {a}permission=\"{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action {a}name=\"{w}.service.notification.NotificationListenerService\"/></intent-filter></service><service {a}name=\".AssistantBackgroundService\" {a}exported=\"false\"/><receiver {a}name=\".SystemEventReceiver\" {a}exported=\"true\"><intent-filter><action {a}name=\"{w}.intent.action.BOOT_COMPLETED\"/><action {a}name=\"{w}.provider.Telephony.SMS_RECEIVED\"/><action {a}name=\"{w}.intent.action.PHONE_STATE\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_CONNECTED\"/><action {a}name=\"{w}.intent.action.ACTION_POWER_DISCONNECTED\"/><action {a}name=\"{w}.net.conn.CONNECTIVITY_CHANGE\"/><action {a}name=\"{w}.media.RINGER_MODE_CHANGED\"/></intent-filter></receiver></application></manifest>")
          p = "app/src/main/java/com/personal/voiceassistant/"
          for fn in os.listdir(p):
              if fn.endswith(".java"):
                  s = open(p + fn).read()
                  s = re.sub(r"\b(String|SmsMessage)\s+([a-zA-Z0-9_]+)\s*=", rf"\1{lb}{rb} \2 =", s)
                  s = s.replace("new String;", f"new String{lb}p.size(){rb};").replace("new String{", f"new String{lb}{rb}{{")
                  s = s.replace("String[] a = new String;", f"String{lb}{rb} a = new String{lb}p.size(){rb};")
                  open(p + fn, "w").write(s)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"
