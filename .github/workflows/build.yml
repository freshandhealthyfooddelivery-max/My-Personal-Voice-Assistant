name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Native AI Core Engine
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          w = "andr" + "oid"
          a = w + chr(58)
          lb = chr(91)
          rb = chr(93)

          logo = f"<vector xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\" {a}width=\"108dp\" {a}height=\"108dp\" {a}viewportWidth=\"108\" {a}viewportHeight=\"108\"><path {a}fillColor=\"#050811\" {a}pathData=\"M0,0h108v108h-108z\"/><path {a}fillColor=\"#0F172A\" {a}pathData=\"M54,10 A44,44 0 1,1 53.9,10 Z\"/><path {a}fillColor=\"#38BDF8\" {a}pathData=\"M54,22 L62,46 L86,54 L62,62 L54,86 L46,62 L22,54 L46,46 Z\"/></vector>"
          open("app/src/main/res/drawable/ic_nahim_logo.xml", "w").write(logo)

          manifest = f"<manifest xmlns{chr(58)}{w}=\"http://schemas.{w}.com/apk/res/{w}\"><uses-permission {a}name=\"{w}.permission.INTERNET\"/><uses-permission {a}name=\"{w}.permission.ACCESS_COARSE_LOCATION\"/><uses-permission {a}name=\"{w}.permission.RECORD_AUDIO\"/><uses-permission {a}name=\"{w}.permission.CAMERA\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_BOOT_COMPLETED\"/><uses-permission {a}name=\"{w}.permission.RECEIVE_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_SMS\"/><uses-permission {a}name=\"{w}.permission.READ_PHONE_STATE\"/><uses-permission {a}name=\"{w}.permission.CALL_PHONE\"/><uses-permission {a}name=\"{w}.permission.ANSWER_PHONE_CALLS\"/><uses-permission {a}name=\"{w}.permission.READ_CONTACTS\"/><uses-permission {a}name=\"{w}.permission.POST_NOTIFICATIONS\"/><uses-permission {a}name=\"{w}.permission.FOREGROUND_SERVICE\"/><uses-permission {a}name=\"{w}.permission.WAKE_LOCK\"/><uses-permission {a}name=\"{w}.permission.MODIFY_AUDIO_SETTINGS\"/><uses-permission {a}name=\"{w}.permission.ACCESS_NOTIFICATION_POLICY\"/><application {a}allowBackup=\"true\" {a}icon=\"@drawable/ic_nahim_logo\" {a}label=\"Nahim AI\" {a}supportsRtl=\"true\" {a}theme=\"@style/Theme.AppCompat.NoActionBar\"><activity {a}name=".MainActivity" {a}exported="true"><intent-filter><action {a}name="{w}.intent.action.MAIN"/><category {a}name="{w}.intent.category.LAUNCHER"/></intent-filter></activity><activity {a}name=".VoiceAssistActivity" {a}exported="true" {a}showOnLockScreen="true" {a}turnScreenOn="true"><intent-filter><action {a}name="{w}.intent.action.ASSIST"/><action {a}name="{w}.intent.action.VOICE_COMMAND"/><category {a}name="{w}.intent.category.DEFAULT"/></intent-filter></activity><service {a}name=".AssistantTileService" {a}exported="true" {a}icon="@drawable/ic_nahim_logo" {a}label="Nahim AI" {a}permission="{w}.permission.BIND_QUICK_SETTINGS_TILE"><intent-filter><action {a}name="{w}.service.quicksettings.action.QS_TILE"/></intent-filter></service><service {a}name=".AppNotificationListener" {a}exported="true" {a}permission="{w}.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action {a}name="{w}.service.notification.NotificationListenerService"/></intent-filter></service><service {a}name=".AssistantBackgroundService" {a}exported="false"/><receiver {a}name=".SystemEventReceiver" {a}exported="true"><intent-filter><action {a}name="{w}.intent.action.BOOT_COMPLETED"/><action {a}name="{w}.provider.Telephony.SMS_RECEIVED"/><action {a}name="{w}.intent.action.PHONE_STATE"/><action {a}name="{w}.intent.action.ACTION_POWER_CONNECTED"/><action {a}name="{w}.intent.action.ACTION_POWER_DISCONNECTED"/><action {a}name="{w}.net.conn.CONNECTIVITY_CHANGE"/><action {a}name="{w}.media.RINGER_MODE_CHANGED"/></intent-filter></receiver></application></manifest>"
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          p = "app/src/main/java/com/personal/voiceassistant/"
          weather = f"""package com.personal.voiceassistant;
          import {w}.content.Context;
          import {w}.icu.util.IslamicCalendar;
          import {w}.os.*;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.*;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class SmartCalendarWeather {{
              public static String getEnglishAndDayInfo() {{
                  Calendar cal = Calendar.getInstance();
                  String{lb}{rb} days = {{"রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"}};
                  return "আজ " + days{lb}cal.get(Calendar.DAY_OF_WEEK) - 1{rb} + ", ইংরেজি " + new SimpleDateFormat("dd MMMM yyyy", Locale.US).format(new Date());
              }}
              public static String getHijriDateInfo(Context ctx) {{
                  String c = readCustom(ctx, "arabic_cal.txt");
                  if (c != null) return c;
                  IslamicCalendar ic = new IslamicCalendar();
                  String{lb}{rb} m = {{"মহররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল", "জিলকদ", "জিলহজ"}};
                  return "আজ আরবি হিজরি " + ic.get(IslamicCalendar.DATE) + " " + m{lb}ic.get(IslamicCalendar.MONTH){rb} + " " + ic.get(IslamicCalendar.YEAR) + " সন";
              }}
              public static String getBanglaDateInfo(Context ctx) {{
                  String c = readCustom(ctx, "bangla_cal.txt");
                  if (c != null) return c;
                  Calendar cal = Calendar.getInstance();
                  int gD = cal.get(Calendar.DAY_OF_MONTH), gM = cal.get(Calendar.MONTH) + 1, gY = cal.get(Calendar.YEAR);
                  int bY = (gM < 4 || (gM == 4 && gD < 14)) ? gY - 594 : gY - 593;
                  String{lb}{rb} bM = {{"বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"}};
                  String{lb}{rb} days = {{"রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"}};
                  int bD = (gD >= 14) ? (gD - 13) : (gD + 17);
                  return "আজ " + days{lb}cal.get(Calendar.DAY_OF_WEEK) - 1{rb} + ", বাংলা " + bD + " " + bM{lb}(gM + 8) % 12{rb} + " " + bY + " বঙ্গাব্দ";
              }}
              public static String readCustom(Context ctx, String fn) {{
                  try {{
                      File f = new File(ctx.getExternalFilesDir(null), fn);
                      if (!f.exists()) return null;
                      String today = new SimpleDateFormat("dd-MM", Locale.US).format(new Date());
                      BufferedReader br = new BufferedReader(new FileReader(f));
                      String l;
                      while ((l = br.readLine()) != null) {{
                          if (l.startsWith(today)) {{ br.close(); return l.substring(today.length()).trim(); }}
                      }}
                      br.close();
                  }} catch (Exception ignored) {{}}
                  return null;
              }}
              public static void fetchAndSpeakWeather(Context ctx) {{
                  new Thread(() -> {{
                      try {{
                          URL u = new URL("https://open-meteo.com");
                          HttpURLConnection conn = (HttpURLConnection) u.openConnection();
                          conn.setConnectTimeout(5000);
                          BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder(); String line;
                          while ((line = in.readLine()) != null) sb.append(line);
                          in.close();
                          JSONObject cur = new JSONObject(sb.toString()).getJSONObject("current");
                          double temp = cur.getDouble("temperature_2m");
                          int hum = cur.getInt("relative_humidity_2m");
                          double wind = cur.getDouble("wind_speed_10m");
                          String msg = "বর্তমান তাপমাত্রা " + temp + " ডিগ্রি সেলসিয়াস, বাতাসের আর্দ্রতা " + hum + " পার্সেন্ট এবং বাতাসের গতিবেগ ঘণ্টায় " + wind + " কিলোমিটার";
                          new Handler(Looper.getMainLooper()).post(() -> SystemEventReceiver.speak(ctx, msg));
                      }} catch (Exception e) {{
                          new Handler(Looper.getMainLooper()).post(() -> SystemEventReceiver.speak(ctx, "আবহাওয়ার তথ্য পেতে ইন্টারনেট সংযোগ চালু রাখুন"));
                      }}
                  }}).start();
              }}
          }}"""
          open(p + "SmartCalendarWeather.java", "w").write(weather)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"
