name: Build Nahim AI Flagship v5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject Interactive JS & Build APK
        run: |
          python3 -c '
          import os
          html_path = "app/src/main/assets/ui.html"
          html = open(html_path).read()
          if "function openP" not in html:
              js = """<script>
              let en=false;
              const keys=["master_switch","call_switch","riding_mode","auto_unsilent","sms_switch","sms_full_read","app_notif_switch","headphone_privacy","battery_switch","full_charge_alarm","theft_alarm","shake_torch","network_alert","namaz_alarm","friday_alert","sleep_mode","morning_brief"];
              window.onload=function(){
                try{
                  keys.forEach(function(k){var e=document.getElementById(k);if(e)e.checked=NahimCore.getBool(k);});
                  document.getElementById("batTxt").innerText="⚡ Live Battery: "+NahimCore.getBattery()+"%";
                }catch(err){}
              };
              function saveB(el){try{NahimCore.setBool(el.id,el.checked);}catch(e){}}
              function openP(id){
                document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
                document.getElementById(id).classList.add("active");
                window.scrollTo(0,0);
              }
              function toggleLang(){
                en=!en;
                document.getElementById("lBtn").innerText=en?"বাংলা":"English";
                document.querySelectorAll("[data-bn]").forEach(function(el){el.innerText=en?el.getAttribute("data-en"):el.getAttribute("data-bn");});
              }
              function setV(l){try{NahimCore.setStr("voice_lang",l);NahimCore.action("test_voice");}catch(e){}}
              function setG(m){try{NahimCore.setBool("voice_male",m);NahimCore.action("test_voice");}catch(e){}}
              function runCall(){
                var n=document.getElementById("cNum").value,s=parseInt(document.getElementById("cSec").value);
                if(n&&s)NahimCore.startAutoCall(n,s);
              }
              </script></body></html>"""
              html = html.replace("</body>", "").replace("</html>", "") + js
              open(html_path, "w").write(html)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nahim-AI-Flagship-v5
          path: "**/app-debug.apk"
