name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Manifest
        run: |
          sed -i 's/ <uses-permission name=/ <uses-permission android:name=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ name=/ android:name=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ exported=/ android:exported=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ allowBackup=/ android:allowBackup=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ label=/ android:label=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ supportsRtl=/ android:supportsRtl=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ theme=/ android:theme=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ icon=/ android:icon=/g' app/src/main/AndroidManifest.xml
          sed -i 's/ permission=/ android:permission=/g' app/src/main/AndroidManifest.xml
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoiceAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
