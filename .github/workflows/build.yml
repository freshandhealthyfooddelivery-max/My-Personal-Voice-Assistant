name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Clean Manifest
        run: |
          python3 -c '
          a = "android" + chr(58)
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns{chr(58)}android="http://android.com">
              <uses-permission {a}name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission {a}name="android.permission.RECEIVE_SMS" />
              <uses-permission {a}name="android.permission.READ_SMS" />
              <uses-permission {a}name="android.permission.READ_PHONE_STATE" />
              <uses-permission {a}name="android.permission.CALL_PHONE" />
              <uses-permission {a}name="android.permission.READ_CONTACTS" />
              <uses-permission {a}name="android.permission.POST_NOTIFICATIONS" />
              <application {a}allowBackup="true" {a}label="Voice Assistant" {a}supportsRtl="true" {a}theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity {a}name=".MainActivity" {a}exported="true">
                      <intent-filter>
                          <action {a}name="android.intent.action.MAIN" />
                          <category {a}name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service {a}name=".AssistantTileService" {a}exported="true" {a}icon="@android:drawable/ic_btn_speak_now" {a}label="Voice Assistant" {a}permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action {a}name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoiceAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
