plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.voiceassistant"
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName "4.0-GalaxyUltra"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
